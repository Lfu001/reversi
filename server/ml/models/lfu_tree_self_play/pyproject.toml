[project]
name = "lfu-tree-self-play"
version = "0.1.0"
description = "Independent tree self-play experiment package."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.3.3",
    "omegaconf==2.3.1",
    "reversi==0.1.0",
    "torch==2.14.1",
    "transformers==5.18.0",
]

[tool.uv.sources]
reversi = { path = "../../reversi-py" }

[project.scripts]
lfu-tree-self-play = "lfu_tree_self_play.cli:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
