[project]
name = "lfu-tree-self-play"
version = "0.1.0"
description = "Independent tree self-play experiment package."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
lfu-tree-self-play = "lfu_tree_self_play.cli:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
