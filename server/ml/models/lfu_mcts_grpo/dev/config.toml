# Model architecture settings
[model]
hidden_size = 512
num_attention_heads = 8
num_layers = 4
num_inner_loops = 8
truncation_steps = 2
expansion_ratio = 4
conv_kernel_size = 2
dropout = 0.0
layer_norm_eps = 1e-5

# MCTS settings
[mcts]
num_simulations = 800
dirichlet_epsilon = 0.25
dirichlet_alpha = 0.3
c_puct = 1.25
max_inference_batch_size = 2048
states_per_inference = 8

# Training settings
[training]
batch_size = 256
replay_buffer_size = 100_000
learning_rate = 1e-3
weight_decay = 1e-4
total_training_steps = 12_000
games_per_iteration = 256
training_steps_per_iteration = 200
warmup_steps = 400
lambda_value = 1.0

# Tree-GRPO settings
[grpo]
lambda_grpo = 1.5
grpo_num_pairs = 16
