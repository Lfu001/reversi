worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK";
        }

        # A catch-all location for models. This can be configured later.
        location /models/ {
            # Example: proxy_pass http://some_ml_service/;
            return 501 "Not Implemented";
        }
    }
}
