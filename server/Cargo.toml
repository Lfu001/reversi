[workspace]
resolver = "3"
members = [
    "common",
    "gateway",
    "reversi-core",
    "game",
    "ml/reversi-py",
    "ml/models/lfu_mcts_grpo/dev/mcts_grpo/mcts",
]
default-members = [
    "common",
    "gateway",
    "reversi-core",
    "game",
]

[workspace.dependencies]
actix-cors = "0.7.1"
actix-web = "4.11.0"
actix-ws = "0.3.0"
async-trait = "0.1.89"
base64 = "0.22.1"
common = { version = "0.1.0", path = "common" }
dashmap = "6.1.0"
env_logger = "0.11.8"
fastrand = "2.3.0"
futures-util = "0.3.31"
indicatif = { version = "0.18.3", features = ["rayon"] }
jwt-simple = "0.12.12"
log = "0.4.28"
ndarray = "0.16.1"
num-derive = "0.4.2"
num-traits = "0.2.19"
numpy = "0.26.0"
pyo3 = "0.26.0"
rand = "0.9.2"
rand_distr = "0.5.1"
rayon = "1.11.0"
redis = "0.27.6"
redis-test = "0.6.0"
reversi-core = { version = "0.1.0", path = "reversi-core" }
serde = "1.0.228"
serde_json = "1.0.145"
serde_with = "3.15.1"
serial_test = "3.2.0"
sha3 = "0.10.8"
tokio = "1.47.1"
tokio-macros = "2.5.0"
ureq = "2.12.1"
url = "2.5.7"
uuid = "1.18.1"
