on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "server/common/**"
      - "server/game/**"

name: code quality (game)

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run rustfmt
        run: |
          cargo fmt --all --check
        working-directory: ./server/game

  lint:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run clippy
        run: cargo clippy --all-targets --all-features
        working-directory: ./server/game
