name: test (ml)

on:
  push:
    paths:
      - 'server/ml/**'
      - '.github/workflows/test-ml.yml'
  pull_request:
    paths:
      - 'server/ml/**'
      - '.github/workflows/test-ml.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Find and run model tests
        working-directory: ./server/ml
        run: |
          # Find all model directories and run their tests
          find models -mindepth 1 -maxdepth 1 -type d | while read -r model_dir; do
            if [ -d "$model_dir" ]; then
              echo "\n=== Running tests for $model_dir ==="
              (
                cd "$model_dir"
                uv run pytest
              )
            fi
          done
