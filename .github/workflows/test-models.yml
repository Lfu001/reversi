on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/test-models.yml'
      - 'server/ml/inference_kit/**'
      - 'server/ml/models/**'

name: test (models)

jobs:
  tree-self-play:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server/ml/models/lfu_tree_self_play
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check package import
        run: uv run --locked python -c "import lfu_tree_self_play"
      - name: Collect unit tests
        run: uv run --locked pytest --collect-only -q
      - name: Run unit tests
        run: uv run --locked pytest -q
      - name: Verify installed wheel outside the source tree
        run: bash scripts/check-wheel.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [
          'models/lfu_random',
        ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Run tests for ${{ matrix.model }}
        working-directory: ./server/ml
        run: |
          cd "${{ matrix.model }}" && uv run pytest
