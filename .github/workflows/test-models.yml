on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/test-models.yml'
      - 'server/ml/inference_kit/**'
      - 'server/ml/models/**'
      - 'server/ml/reversi-py/**'
      - 'server/reversi-core/**'
      - 'server/common/**'

name: test (models)

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [
          'models/lfu_random',
          'models/lfu_tree_self_play',
        ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Run tests for ${{ matrix.model }}
        working-directory: ./server/ml
        run: |
          cd "${{ matrix.model }}" && uv run pytest

      - name: Verify policy gradients
        if: matrix.model == 'models/lfu_tree_self_play'
        working-directory: ./server/ml/models/lfu_tree_self_play
        run: |
          mkdir -p artifacts
          uv run --locked lfu-tree-self-play verify-policy-gradient --output artifacts/policy-gradient-verification.json

      - name: Save policy gradient verification report
        if: always() && matrix.model == 'models/lfu_tree_self_play'
        uses: actions/upload-artifact@v4
        with:
          name: policy-gradient-verification
          path: server/ml/models/lfu_tree_self_play/artifacts/policy-gradient-verification.json
          if-no-files-found: error
