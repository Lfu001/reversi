on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "server/ml/reversi-py/**"

name: build and test (reversi-py)

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run build
        uses: PyO3/maturin-action@v1
        with:
          command: build
          working-directory: ./server/ml/reversi-py

  test:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Run test
        working-directory: ./server/ml/reversi-py
        run: |
          uv run pytest
