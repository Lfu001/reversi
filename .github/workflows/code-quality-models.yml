on:
  push:
    branches: [main]
  pull_request:
    paths:
      - server/ml/inference_kit/**
      - server/ml/models/**

name: code quality (models)

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/ruff-action@v1
        name: Run ruff format
        with:
          args: format --check
          src: ./server/ml/inference_kit
      - uses: astral-sh/ruff-action@v1
        name: Run ruff format
        with:
          args: format --check
          src: ./server/ml/models

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/ruff-action@v1
        name: Run ruff lint
        with:
          args: check
          src: ./server/ml/inference_kit
      - uses: astral-sh/ruff-action@v1
        name: Run ruff lint
        with:
          args: check
          src: ./server/ml/models
